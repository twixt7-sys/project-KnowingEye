# Knowing Eye - production AI pipeline configuration (backend/ai)
# §2.1.4 AI & Monitoring Architecture
#
# Directive Area 04 ("Define every CV parameter" / "Threshold justification", P0):
# every threshold below is cited here AND in docs/documentation/chapter2/03-system-design.html
# (sections "CV Parameter Specification" and "Threshold justification") so the citation lives
# next to the value. See that doc for the full 7-row parameter table and per-threshold sources.

pipeline:
  target_fps: 5                    # Snapshot cadence, not continuous video - see 03-system-design.html
                                    # "Snapshot monitoring" for the bandwidth/retention rationale.
  alert_threshold_pct: 80          # Session-level compliance-score cutoff used by the classification
                                    # methodology in 04-system-testing.html#ai-evaluation.
  identity_match_threshold: 0.42   # Cosine distance (~0.58 similarity). InsightFace's own model guide
                                    # gives a 0.40-similarity worked example for buffalo_l; this is
                                    # deliberately stricter (fewer false accepts). See "Threshold
                                    # justification" in 03-system-design.html for the full citation.
                                    # This distance maps exactly onto the 80% alert cutoff
                                    # (normalize.threshold_compliance_pct).
  frame_buffer_depth: 3
  identity_check_every_n_frames: 3 # ArcFace/InsightFace re-runs its own full-frame face detector on
                                    # top of MediaPipe's, so it dominates per-frame latency once a
                                    # reference is enrolled. Checking identity every Nth frame (and
                                    # reusing the last match/distance in between) keeps the bounding
                                    # box - which only ever comes from MediaPipe - rendering close to
                                    # the client's capture rate instead of queueing behind ArcFace.
  identity_async: true             # Run those ArcFace checks on a background thread; each frame reports
                                    # the rolling median of the checks finished so far, so the analysis
                                    # reply (and the bounding box) never waits on the embedding model.

preprocessing:
  max_width: 640
  denoise: light          # off | light | strong
  normalize_histogram: true

detection:
  face_backend: mediapipe
  pose_backend: mediapipe
  pose_model: full                  # lite | full | heavy. "full" is markedly more stable on shoulder/ear
                                     # landmarks than "lite" at webcam range for a small CPU cost; "heavy"
                                     # is rarely worth it at 1-5 fps. Falls back to lite if it can't load.
  pose_min_visibility: 0.5          # Both shoulders must be at least this visible for the upper body to
                                     # count as present - MediaPipe always emits all 33 points, including
                                     # extrapolated off-frame ones. Exception: while the examinee's identity
                                     # is detected and their face box is in view, Up is 100%; with any other
                                     # signal detected (face box, identity or pose) it stays within 50-100%
                                     # by shoulder visibility (normalize.upper_body_presence_pct), so close
                                     # framing that cuts the shoulders off never reads as 0%.

recognition:
  embedding_backend: arcface
  arcface_model: buffalo_l
  arcface_det_size: 320             # RetinaFace input size. Client frames are <=480px wide with the face
                                     # filling a large share of the frame, so 640x640 only upscaled them
                                     # (~4x the detector compute) without finding anything 320 misses.
  gaze_yaw_threshold_deg: 40        # Head yaw used as the gaze proxy (no true pupil/eye tracking -
  gaze_pitch_threshold_deg: 35      # standard practice at webcam, non-IR resolution). Angle alone
                                     # never flags anything; it must also persist across the temporal
                                     # window below (behavior.suspicious_pattern) - see "Threshold
                                     # justification" for the cited rationale on duration-pairing.
  posture_shoulder_tilt_max: 0.18   # tan(shoulder-line angle); 0.18 ~= 10 deg of whole-torso side lean.
  posture_spine_lean_max: 0.30      # Head (ear-midpoint) offset from the shoulder midpoint along the
                                     # shoulder axis / shoulder width; 0 = centred, 0.5 = head over one
                                     # shoulder. Hips are NOT used - they are off-frame on a webcam.
                                     # Both are landmark-geometry ratios tuned against MediaPipe's own
                                     # BlazePose topology, not an external benchmark - internally derived.
                                     # Posture quality is 100% below half the limit and falls to 0% at
                                     # twice it (normalize.posture_quality_pct). Re-derive with
                                     # scripts/calibrate_monitoring.py on your own captures.
  identity_smoothing_window: 5      # Identity distance reported = median of the last N ArcFace checks.
  identity_min_face_px: 64          # Skip identity checks on faces smaller than this (px, short side)...
  identity_max_yaw_deg: 30          # ...or turned further than this. ArcFace distances inflate on
  identity_max_pitch_deg: 30        # off-angle/small faces; those frames carry the last decision over
                                     # instead of raising false "different person" alerts.
  no_face_grace_seconds: 2.0        # Anomaly = absence beyond this grace period, not a single missed
                                     # frame - this is the literal answer to "why not flag every blink."

behavior:
  ebi_bands:                        # Ordinal classification of the composite Exam Behavior Index
    good_min: 80                    # EBI >= 80 -> "good". Matches alert_threshold_pct (the per-metric
                                     # compliance cutoff) and is stricter than the 75% "no-risk"
                                     # boundary of the cited proctoring risk model - see "Threshold
                                     # justification" in 03-system-design.html.
    mid_min: 50                     # 50 <= EBI < 80 -> "mid" (review); EBI < 50 -> "bad" (high concern).
                                     # 50 is where the same cited risk model assigns its maximum risk
                                     # weight. Threshold-based behaviour classification per [14].
  leaving_seat_grace_seconds: 3.0   # Same grace-period principle as no_face_grace_seconds, applied to
                                     # upper-body-visibility (pose landmark presence). Not raised while the
                                     # identity-verified examinee's face box is in view.
  suspicious_pattern:
    window_seconds: 60              # Sliding-window temporal aggregation to suppress single-frame
    min_flags: 3                    # false positives - an established anomaly-detection technique
    cooldown_seconds: 120           # (see cited literature in 03-system-design.html); this is a
                                     # project-tuned instance of that general technique.
  metric_weights:                   # LEGACY / UNUSED. The composite is now the equal-weight
    face: 0.3                       # Exam Behavior Index (EBI = mean of the four normalized
    gaze: 0.3                       # indicators) - see behavior/normalize.exam_behavior_index_pct
    posture: 0.25                   # and docs/documentation/chapter2/04-system-testing.html#ebi.
    identity: 0.15                  # Retained only for reference; no code reads these to weight EBI.
  weights:                          # Per-event-type weight - identity_mismatch and no_face are
    no_face: 1.0                    # weighted highest since they most directly threaten exam
                                     # integrity; bad_posture lowest since it is the weakest signal
    looking_away: 0.7                # on its own.
    bad_posture: 0.6
    leaving_seat: 0.75
    identity_mismatch: 0.95
    suspicious_pattern: 0.9
  alert_severity:
    no_face: high
    looking_away: medium
    bad_posture: low
    leaving_seat: medium
    identity_mismatch: high
    suspicious_pattern: high

paths:
  reference_faces_dir: data/reference_faces
  sessions_output_dir: data/sessions
  training_data_dir: training/data  # Present but empty - see "Dataset Methodology" in
                                     # 03-system-design.html. MediaPipe/ArcFace run as frozen
                                     # pre-trained models; nothing here trains against this path yet.

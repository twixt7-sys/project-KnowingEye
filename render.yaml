services:
  # Django + Channels API, served over ASGI (Daphne) so WebSocket monitoring works.
  - type: web
    name: knowing-eye-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: singapore
    healthCheckPath: /api/monitoring/health/
    autoDeploy: true
    # Runs once per deploy, before the new instance takes traffic.
    preDeployCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      # Supabase's session-mode pooler (5432) caps concurrent clients at the
      # project's pool_size (15) - Daphne's async-to-sync thread pool can
      # exceed that under a burst of requests (EMAXCONNSESSION). The
      # transaction-mode pooler (6543) multiplexes many clients over a small
      # number of backend connections instead, so use it here. It also
      # doesn't support Django holding a connection open across requests, so
      # CONN_MAX_AGE must stay 0 - see docs/deployment.md.
      - key: DB_PORT
        value: "6543"
      - key: DB_CONN_MAX_AGE
        value: "0"
      - key: KE_ENABLE_PIPELINE
        value: "True"
      - key: KE_ALERT_THRESHOLD
        value: "80"
      - key: KE_STORE_FRAMES
        value: "False"
      - key: JWT_ACCESS_TTL_MIN
        value: "30"
      - key: JWT_REFRESH_TTL_DAYS
        value: "14"
      # --- fill these in the Render dashboard after first deploy (see runbook) ---
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_OTP_FUNCTION_SECRET
        sync: false

  # React SPA build, served as a static site.
  - type: web
    name: knowing-eye-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set to the knowing-eye-api service URL + /api once it exists (see runbook).
      - key: VITE_API_BASE_URL
        sync: false
